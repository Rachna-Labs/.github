# Reusable check for every Kotlin Multiplatform repo in rachna-labs.
#
# Caller:
#   jobs:
#     check:
#       uses: rachna-labs/.github/.github/workflows/kmp-check.yml@master
#       with:
#         tasks: ":shared:testDebugUnitTest :androidApp:assembleDebug"
#       secrets: inherit
#
# The product is checked out at product/02-Platforms/01-App and rachna-kit at 00-Shared/01-Kit (the
# tag in `.rachna-kit`): the same layout as a laptop, so `includeBuild("../../../00-Shared/01-Kit")`
# works in both.
#
# A product whose repo is rooted at 02-Platforms rather than at 01-App (Plate, Try) passes
# `checkout-path`, and `gradle-dir` when the Gradle build is not at the repo root. Both
# default to the old single location, so every other caller is unaffected.
name: kmp-check
on:
  workflow_call:
    inputs:
      tasks:
        description: Gradle tasks to run
        type: string
        required: true
      tokens-check:
        description: Check generated design tokens are up to date (rachna-kit only)
        type: boolean
        default: false
      checkout-path:
        description: Where the product repo is checked out
        type: string
        default: product/02-Platforms/01-App
      gradle-dir:
        description: Where ./gradlew lives. Defaults to checkout-path.
        type: string
        default: ""
    secrets:
      KIT_DEPLOY_KEY:
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ inputs.checkout-path }}

      # FOUND, not assumed. This read `<checkout-path>/.rachna-kit`, and no product has the
      # file there: it sits beside the app's Gradle build, which is one or two folders in
      # (01-App, or 02-Platforms/01-App). So the pin was always empty, the kit was never
      # checked out, and every KMP product failed with "Included build .../00-Shared/01-Kit
      # does not exist" from 2026-10-31 on. The error names the kit, which is why it read as
      # a kit problem rather than as this.
      - name: Which rachna-kit
        id: kit
        run: |
          pin=$(find "${{ inputs.checkout-path }}" -maxdepth 4 -name .rachna-kit -print -quit 2>/dev/null || true)
          if [ -n "$pin" ]; then
            echo "ref=$(tr -d '[:space:]' < "$pin")" >> "$GITHUB_OUTPUT"
            echo "Pinned to $(tr -d '[:space:]' < "$pin") by $pin"
          else
            echo "No .rachna-kit under ${{ inputs.checkout-path }}, so the kit is not checked out."
          fi

      - name: KIT_DEPLOY_KEY is set
        if: steps.kit.outputs.ref != ''
        env:
          KIT_DEPLOY_KEY: ${{ secrets.KIT_DEPLOY_KEY }}
        run: |
          [ -n "$KIT_DEPLOY_KEY" ] || { echo "::error::The KIT_DEPLOY_KEY repo secret is missing (read-only deploy key on rachna-kit). Run make github-setup, see rachna-hq 02-Engineering/github.md"; exit 1; }

      # STILL THE OLD REPO, ON PURPOSE. rachna-kit was archived on 2026-11-10 when it
      # became rachna-shared's 01-Kit (decision 0015). An archived repo can still be
      # cloned, and the tag a product pins (v0.1.0) exists only there: the subtree import
      # kept the kit's own commits with the kit at their root, so no commit in
      # rachna-shared carries that tag's tree under 01-Kit.
      #
      # CHANGE THIS AT THE NEXT KIT RELEASE, which will be tagged `kit-vX.Y.Z` in
      # rachna-shared: check out `rachna-labs/rachna-shared` at `kit-${{ ref }}` into
      # `00-Shared` instead, and bump every product's `.rachna-kit` in the same PR.
      - uses: actions/checkout@v4
        if: steps.kit.outputs.ref != ''
        with:
          repository: rachna-labs/rachna-kit
          ref: ${{ steps.kit.outputs.ref }}
          path: 00-Shared/01-Kit
          ssh-key: ${{ secrets.KIT_DEPLOY_KEY }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Design tokens are up to date
        if: inputs.tokens-check
        working-directory: ${{ inputs.checkout-path }}
        run: python3 tools/generate_tokens.py --check

      - name: Gradle
        working-directory: ${{ inputs.gradle-dir || inputs.checkout-path }}
        run: ./gradlew ${{ inputs.tasks }}
